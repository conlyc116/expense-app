<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="出差報帳">
<meta name="format-detection" content="telephone=no">
<title>出差報帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="tb-btn" id="tb-back" aria-label="返回" hidden>‹ 返回</button>
  <h1 id="tb-title">出差報帳</h1>
  <button class="tb-btn" id="tb-action" hidden></button>
</header>
<main id="view" tabindex="-1"></main>
<div id="bar" class="bottombar" hidden></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="file-library" accept="image/*" multiple hidden>
<input type="file" id="file-restore" accept="application/json,.json" hidden>
<input type="file" id="file-statement" accept=".csv,text/csv" hidden>
<noscript>此工具需要啟用 JavaScript。</noscript>
<script src="vendor/exceljs.min.js" defer></script>
<script src="vendor/jszip.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
